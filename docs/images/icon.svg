<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cloud" x1="90" y1="90" x2="440" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FE0D0"/>
      <stop offset="0.55" stop-color="#14A6C4"/>
      <stop offset="1" stop-color="#0B6FA8"/>
    </linearGradient>
    <radialGradient id="glass" cx="262" cy="268" r="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B4D6E"/>
      <stop offset="0.6" stop-color="#132A44"/>
      <stop offset="1" stop-color="#08172A"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#062C46" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Cloud: overlapping shapes sharing one gradient space, so no seams -->
  <g fill="url(#cloud)" filter="url(#soft)">
    <circle cx="300" cy="222" r="134"/>
    <circle cx="170" cy="272" r="96"/>
    <circle cx="412" cy="300" r="74"/>
    <rect x="82" y="272" width="404" height="124" rx="62"/>
  </g>

  <!-- Camera lens -->
  <circle cx="282" cy="290" r="92" fill="#FFFFFF"/>
  <circle cx="282" cy="290" r="74" fill="#0E2238"/>
  <circle cx="282" cy="290" r="60" fill="url(#glass)"/>
  <circle cx="282" cy="290" r="30" fill="#0A1626"/>
  <circle cx="282" cy="290" r="30" fill="none" stroke="#3FE0D0" stroke-opacity="0.55" stroke-width="3"/>
  <!-- glints -->
  <ellipse cx="258" cy="264" rx="16" ry="11" fill="#FFFFFF" fill-opacity="0.85" transform="rotate(-35 258 264)"/>
  <circle cx="305" cy="314" r="5" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Live indicator -->
  <circle cx="392" cy="214" r="17" fill="#FFFFFF"/>
  <circle cx="392" cy="214" r="11" fill="#FF4D5E"/>
</svg>
